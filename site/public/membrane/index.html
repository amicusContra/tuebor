          '<span class="sr-section pill pill-' + section + '">' + section + '</span></div>' +
          '<div class="sr-snippet">' + snippet + '</div></a>';
      }).join('');
    }

    function renderLocalResults(pages, q) {
      if (!pages.length) {
        searchResults.innerHTML = '<div style="padding:0.5rem;color:var(--fg-dim);font-size:0.8rem">No results for "' + esc(q) + '"</div>';
        return;
      }
      searchResults.innerHTML = pages.map(function(p) {
        return '<a class="sr-item" href="' + esc(p.url) + '">' +
          '<div><span class="sr-title">' + esc(p.title) + '</span>' +
          '<span class="sr-section pill pill-' + p.section + '">' + p.section + '</span></div>' +
          '<div class="sr-snippet">' + esc(p.desc) + '</div></a>';
      }).join('');
    }

    function guessSectionFromUrl(url) {
      if (url.indexOf('/actors/') >= 0) return 'actors';
      if (url.indexOf('/evidence/') >= 0) return 'evidence';
      if (url.indexOf('/analysis/') >= 0) return 'analysis';
      if (url.indexOf('/investigate/') >= 0) return 'investigate';
      if (url.indexOf('/timeline') >= 0) return 'timeline';
      return 'analysis';
    }

    function highlightSnippet(body, q, maxLen) {
      var lower = body.toLowerCase();
      var qLower = q.toLowerCase();
      var idx = lower.indexOf(qLower);
      var start = Math.max(0, idx - 40);
      var end = Math.min(body.length, start + maxLen);
      var snippet = body.substring(start, end);
      if (start > 0) snippet = '…' + snippet;
      if (end < body.length) snippet = snippet + '…';
      return snippet.replace(new RegExp('(' + escRegex(q) + ')', 'gi'), '<mark>$1</mark>');
    }

    // ======== NAV GRID ========
    var navGrid = document.getElementById('nav-grid');
    renderNavGrid('all');

    document.getElementById('section-filters').addEventListener('click', function(e) {
      if (!e.target.classList.contains('filter-btn')) return;
      this.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      e.target.classList.add('active');
      renderNavGrid(e.target.dataset.filter);
    });

    function renderNavGrid(filter) {
      var filtered = filter === 'all' ? PAGES : PAGES.filter(function(p) { return p.section === filter; });
      navGrid.innerHTML = filtered.map(function(p) {
        var countyPills = p.counties.map(function(c) { return '<span class="pill pill-county">' + esc(c) + '</span>'; }).join('');
        var refCount = p.refs.length;
        return '<a class="nav-item" href="' + esc(p.url) + '" data-section="' + p.section + '">' +
          '<div class="ni-title">' + esc(p.title) + '</div>' +
          '<div class="ni-desc">' + esc(p.desc) + '</div>' +
          '<div class="ni-meta">' +
            '<span class="pill pill-' + p.section + '">' + p.section + '</span>' +
            countyPills +
            (refCount > 0 ? '<span class="pill pill-count">' + refCount + ' refs</span>' : '') +
          '</div></a>';
      }).join('');
    }

    // ======== ENTITY GRAPH ========
    renderGraph();

    function renderGraph() {
      var container = document.getElementById('graph-container');
      var W = container.clientWidth || 600;
      var H = Math.max(360, W * 0.5);

      var nodes = PAGES.map(function(p, i) {
        var angle = (i / PAGES.length) * 2 * Math.PI;
        var section = p.section;
        var r = section === 'actors' ? 0.25 : section === 'evidence' ? 0.45 : section === 'analysis' ? 0.65 : 0.82;
        r *= Math.min(W, H) * 0.42;
        return {
          id: p.id, section: p.section, title: p.title.length > 22 ? p.title.substring(0,20) + '…' : p.title,
          x: W/2 + r * Math.cos(angle - Math.PI/2),
          y: H/2 + r * Math.sin(angle - Math.PI/2),
          url: p.url, refs: p.refs
        };
      });
      var nodeMap = {};
      nodes.forEach(function(n) { nodeMap[n.id] = n; });

      var edges = [];
      PAGES.forEach(function(p) {
        p.refs.forEach(function(ref) {
          if (nodeMap[ref] && p.id < ref) {
            edges.push({ from: p.id, to: ref });
          }
        });
      });

      var colors = { actors: 'var(--red)', evidence: 'var(--green)', analysis: 'var(--purple)', investigate: 'var(--cyan)' };

      var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
      edges.forEach(function(e) {
        var a = nodeMap[e.from], b = nodeMap[e.to];
        if (a && b) svg += '<line class="graph-edge" x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '"/>';
      });
      nodes.forEach(function(n) {
        var c = colors[n.section] || 'var(--fg-dim)';
        svg += '<a href="' + n.url + '" class="graph-node">' +
          '<circle cx="' + n.x + '" cy="' + n.y + '" r="7" fill="' + c + '" stroke="' + c + '" stroke-width="1.5" opacity="0.85"/>' +
          '<text x="' + (n.x + 10) + '" y="' + (n.y + 3) + '" fill="var(--fg-dim)" font-size="9">' + esc(n.title) + '</text></a>';
      });
      svg += '</svg>';
      container.innerHTML = svg;
      container.style.height = H + 'px';
    }

    // ======== CROSS-REF MATRIX ========
    renderXref();

    function renderXref() {
      var table = document.getElementById('xref-table');
      var html = '<thead><tr><th>Page</th><th>Section</th><th>Cross-References</th></tr></thead><tbody>';
      PAGES.filter(function(p) { return p.refs.length > 0; }).sort(function(a,b) { return b.refs.length - a.refs.length; }).forEach(function(p) {
        var refTags = p.refs.map(function(ref) {
          var rp = PAGES.find(function(x) { return x.id === ref; });
          if (!rp) return '';
          var c = { actors: 'var(--red)', evidence: 'var(--green)', analysis: 'var(--purple)', investigate: 'var(--cyan)' }[rp.section] || 'var(--fg-dim)';
          return '<a class="xref-tag" href="' + esc(rp.url) + '" style="background:' + c.replace(')', ',0.12)').replace('var(', 'rgba(') + ';background:color-mix(in srgb, ' + c + ' 12%, transparent);color:' + c + '">' + esc(rp.title.length > 28 ? rp.title.substring(0,26)+'…' : rp.title) + '</a>';
        }).join('');
        html += '<tr><td class="xref-from"><a href="' + esc(p.url) + '">' + esc(p.title.length > 32 ? p.title.substring(0,30)+'…' : p.title) + '</a></td>' +
          '<td><span class="pill pill-' + p.section + '">' + p.section + '</span></td>' +
          '<td>' + refTags + '</td></tr>';
      });
      html += '</tbody>';
      table.innerHTML = html;
    }

    // ======== TIMELINE ========
    renderTimeline();

    function renderTimeline() {
      var strip = document.getElementById('timeline-strip');
      strip.innerHTML = TIMELINE.map(function(y) {
        var eventsHtml = y.events.map(function(e) {
          return '<div class="tl-event"><span class="tl-date">' + esc(e.date) + '</span> ' + esc(e.text) + '</div>';
        }).join('');
        return '<div class="tl-year"><div class="tl-year-label">' + esc(y.year) + '</div>' + eventsHtml + '</div>';
      }).join('');
    }

    // ======== NAV ANCHOR SCROLLING ========
    document.querySelectorAll('.membrane-header .nav-links a').forEach(function(a) {
      a.addEventListener('click', function(e) {
        var href = this.getAttribute('href');
        if (href && href.startsWith('#')) {
          e.preventDefault();
          var el = document.getElementById(href.substring(1));
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            document.querySelectorAll('.membrane-header .nav-links a').forEach(function(x) { x.classList.remove('active'); });
            this.classList.add('active');
          }
        }
      });
    });

    // ======== UTILITIES ========
    function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function escRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    // Responsive graph
    window.addEventListener('resize', debounce(renderGraph, 250));
    function debounce(fn, ms) { var t; return function() { clearTimeout(t); t = setTimeout(fn, ms); }; }

  })();</script>
