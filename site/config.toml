# ── Link Checker ─────────────────────────────────────────────────────────
# Bot-blocked domains are "modified bases" — valid for humans, invisible to
# automated checkers.  skip_prefixes tells zola check to trust them.
# external_level = "warn" downgrades unknown future blockers from build-fail
# to warning so the site always builds.
[link_checker]
external_level = "warn"
skip_prefixes = [
    # Michigan government databases (block all automated requests)
    "https://mibusinessregistry.lara.state.mi.us",  # LARA MiBusiness Registry (replaced COFS June 2025)
    "https://apps.michigan.gov/ichat",         # Criminal History (ICHAT)
    "https://cfrs.michigan.gov",               # Campaign Finance Reporting
    "https://mdocweb.state.mi.us",             # MDOC Offender Tracking (OTIS)
    # Wayne County government (connection-refused to bots)
    "https://courts.waynecounty.com",          # 3rd Circuit Court
    "https://clerk.waynecounty.com",           # County Clerk / Register of Deeds
    "https://wayne.county-taxes.com",          # Treasurer / Tax Records
    # Paywalled news (402 Payment Required)
    "https://eu.freep.com",                    # Detroit Free Press
    "https://www.freep.com",                   # Detroit Free Press (US)
    "https://www.detroitnews.com",             # Detroit News
    # Bot-blocked reference sites (403 Forbidden)
    "https://www.michbar.org",                  # State Bar of Michigan directory (official)
    # (SchoolDigger replaced with mischooldata.org — official MI source)
    "https://www.usnews.com",                  # US News school profiles
    "https://www.jams.com",                    # JAMS mediator profiles
]

# ── Taxonomies — Zola's relational layer ─────────────────────────────────
# Every page can be tagged with actors, entities, courts, and connection
# types. Zola auto-generates a page per term listing all content that
# references it — the "relational database" layer.
[[taxonomies]]
name = "actors"
feed = true

[[taxonomies]]
name = "entities"
feed = true

[[taxonomies]]
name = "courts"

[[taxonomies]]
name = "connections"

[markdown]
smart_punctuation = true

[markdown.highlighting]
style = "class"
theme = "github-dark"

[search]
include_title = "tuebor — Public Record Investigation"
include_description = true
include_content = true

[extra]
author = "ecoPrimal"
repo_url = "https://git.primals.eco/publicRecord/detroit"
contact_email = "eco.primal@pm.me"

