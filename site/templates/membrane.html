<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inner Membrane — Tuebor Investigation Navigator</title>
  <meta name="description" content="Interactive search, entity graph, and cross-reference navigator for all Tuebor investigations.">
  <meta name="robots" content="noindex">
  <style>
    :root {
      --bg: #0c0e14; --surface: #151825; --surface2: #1c2035;
      --border: #2a2e45; --border-hover: #3a3e55;
      --fg: #e0e2f0; --fg-dim: #8088a8; --fg-muted: #5a6080;
      --accent: #7ba0d4; --accent-dim: rgba(123,160,212,0.15);
      --red: #f87171; --red-dim: rgba(248,113,113,0.12);
      --green: #4ade80; --green-dim: rgba(74,222,128,0.12);
      --yellow: #fbbf24; --yellow-dim: rgba(251,191,36,0.12);
      --purple: #a78bfa; --purple-dim: rgba(167,139,250,0.12);
      --orange: #fb923c; --orange-dim: rgba(251,146,60,0.12);
      --cyan: #22d3ee; --cyan-dim: rgba(34,211,238,0.12);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--fg);
      line-height: 1.5; min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Header */
    .membrane-header {
      position: sticky; top: 0; z-index: 100;
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0.5rem 1.25rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .membrane-header .brand {
      font-weight: 700; font-size: 0.95rem; color: var(--fg);
      display: flex; align-items: center; gap: 0.5rem;
    }
    .membrane-header .brand .layer-tag {
      font-size: 0.65rem; font-weight: 600; padding: 0.1rem 0.4rem;
      background: var(--purple-dim); color: var(--purple);
      border-radius: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .membrane-header .nav-links {
      display: flex; gap: 0.15rem; margin-left: 1rem;
    }
    .membrane-header .nav-links a {
      padding: 0.3rem 0.6rem; border-radius: 0.3rem;
      font-size: 0.78rem; color: var(--fg-dim); transition: all 0.15s;
    }
    .membrane-header .nav-links a:hover, .membrane-header .nav-links a.active {
      background: var(--accent-dim); color: var(--accent); text-decoration: none;
    }
    .header-meta { margin-left: auto; display: flex; align-items: center; gap: 1rem; font-size: 0.75rem; color: var(--fg-dim); }
    .header-meta a { color: var(--fg-dim); }

    /* Search */
    .search-bar {
      padding: 0.75rem 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .search-input-wrap {
      position: relative; max-width: 48rem;
    }
    .search-input-wrap input {
      width: 100%; padding: 0.6rem 0.8rem 0.6rem 2.2rem;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 0.4rem; color: var(--fg); font-size: 0.85rem;
      outline: none; transition: border-color 0.15s;
    }
    .search-input-wrap input:focus { border-color: var(--accent); }
    .search-input-wrap input::placeholder { color: var(--fg-muted); }
    .search-input-wrap .search-icon {
      position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%);
      color: var(--fg-muted); font-size: 0.9rem; pointer-events: none;
    }
    .search-results {
      max-width: 48rem; margin-top: 0.5rem;
      max-height: 24rem; overflow-y: auto;
    }
    .search-results:empty { display: none; }
    .sr-item {
      display: block; padding: 0.5rem 0.6rem;
      border-bottom: 1px solid var(--border); cursor: pointer;
      transition: background 0.1s;
    }
    .sr-item:hover { background: var(--surface2); text-decoration: none; }
    .sr-title { font-weight: 600; font-size: 0.85rem; color: var(--fg); }
    .sr-section { font-size: 0.7rem; margin-left: 0.4rem; }
    .sr-snippet { font-size: 0.75rem; color: var(--fg-dim); margin-top: 0.15rem; }
    .sr-snippet mark { background: var(--yellow-dim); color: var(--yellow); padding: 0 0.15rem; border-radius: 2px; }

    /* Main layout */
    .membrane-main {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      padding: 1rem 1.25rem;
      max-width: 90rem;
      margin: 0 auto;
    }
    @media (min-width: 64rem) {
      .membrane-main { grid-template-columns: 1fr 1fr; }
    }

    /* Cards */
    .m-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 0.5rem; overflow: hidden;
    }
    .m-card-header {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .m-card-header h3 {
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--fg-dim);
    }
    .m-card-body { padding: 0.6rem 0.8rem; }
    .m-card-full { grid-column: 1 / -1; }

    /* Pills */
    .pill {
      display: inline-block; padding: 0.1rem 0.45rem;
      border-radius: 0.75rem; font-size: 0.65rem; font-weight: 600;
    }
    .pill-actor { background: var(--red-dim); color: var(--red); }
    .pill-evidence { background: var(--green-dim); color: var(--green); }
    .pill-analysis { background: var(--purple-dim); color: var(--purple); }
    .pill-investigate { background: var(--cyan-dim); color: var(--cyan); }
    .pill-timeline { background: var(--yellow-dim); color: var(--yellow); }
    .pill-county { background: var(--orange-dim); color: var(--orange); }
    .pill-count { background: var(--accent-dim); color: var(--accent); }

    /* Nav grid */
    .nav-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
      gap: 0.5rem;
    }
    .nav-item {
      display: block; padding: 0.6rem 0.7rem;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 0.4rem; transition: all 0.15s; cursor: pointer;
      border-left: 3px solid transparent;
    }
    .nav-item:hover { border-color: var(--border-hover); background: var(--bg); text-decoration: none; }
    .nav-item .ni-title { font-weight: 600; font-size: 0.82rem; color: var(--fg); }
    .nav-item .ni-desc { font-size: 0.72rem; color: var(--fg-dim); margin-top: 0.15rem; }
    .nav-item .ni-meta { margin-top: 0.3rem; display: flex; gap: 0.3rem; flex-wrap: wrap; }
    .nav-item[data-section="actors"] { border-left-color: var(--red); }
    .nav-item[data-section="evidence"] { border-left-color: var(--green); }
    .nav-item[data-section="analysis"] { border-left-color: var(--purple); }
    .nav-item[data-section="investigate"] { border-left-color: var(--cyan); }

    /* Entity graph (SVG) */
    .graph-container {
      width: 100%; min-height: 22rem; position: relative;
      background: var(--bg); border-radius: 0.3rem;
      overflow: hidden;
    }
    .graph-container svg { width: 100%; height: 100%; }
    .graph-node { cursor: pointer; }
    .graph-node circle { transition: r 0.15s, stroke-width 0.15s; }
    .graph-node:hover circle { r: 10; stroke-width: 2.5; }
    .graph-node text { font-family: system-ui, sans-serif; pointer-events: none; }
    .graph-edge { stroke: var(--border); stroke-width: 1; opacity: 0.5; }

    /* Cross-ref matrix */
    .xref-table { width: 100%; border-collapse: collapse; font-size: 0.72rem; }
    .xref-table th { padding: 0.3rem 0.4rem; text-align: left; color: var(--fg-dim); font-weight: 500; border-bottom: 1px solid var(--border); }
    .xref-table td { padding: 0.3rem 0.4rem; border-bottom: 1px solid var(--border); }
    .xref-table tr:last-child td { border-bottom: none; }
    .xref-table .xref-from { font-weight: 600; font-size: 0.78rem; }
    .xref-tag { display: inline-block; margin: 0.1rem; padding: 0.05rem 0.3rem; border-radius: 0.2rem; font-size: 0.65rem; cursor: pointer; }
    .xref-tag:hover { opacity: 0.8; }

    /* Timeline strip */
    .timeline-strip { overflow-x: auto; white-space: nowrap; padding: 0.5rem 0; }
    .tl-year {
      display: inline-block; vertical-align: top;
      margin-right: 0.5rem; padding: 0.4rem 0.6rem;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 0.3rem; white-space: normal; width: 12rem;
    }
    .tl-year-label { font-weight: 700; font-size: 0.85rem; color: var(--accent); margin-bottom: 0.3rem; }
    .tl-event {
      font-size: 0.7rem; color: var(--fg-dim); padding: 0.15rem 0;
      border-bottom: 1px solid var(--border);
    }
    .tl-event:last-child { border-bottom: none; }
    .tl-date { color: var(--fg-muted); font-size: 0.65rem; }

    /* Filter bar */
    .filter-bar {
      display: flex; flex-wrap: wrap; gap: 0.3rem;
      padding: 0.5rem 0;
    }
    .filter-btn {
      padding: 0.25rem 0.6rem; border-radius: 0.3rem;
      font-size: 0.72rem; font-weight: 500; cursor: pointer;
      border: 1px solid var(--border); background: transparent;
      color: var(--fg-dim); transition: all 0.15s;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

    /* Stats row */
    .stats-row { display: flex; gap: 1.5rem; flex-wrap: wrap; padding: 0.3rem 0; }
    .stat-item { display: flex; flex-direction: column; }
    .stat-val { font-size: 1.3rem; font-weight: 700; }
    .stat-label { font-size: 0.65rem; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.05em; }

    /* Responsive */
    @media (max-width: 48rem) {
      .membrane-header .nav-links { display: none; }
      .nav-grid { grid-template-columns: 1fr; }
      .stats-row { gap: 1rem; }
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f6fa; --surface: #fff; --surface2: #f0f1f5;
        --border: #d8dbe5; --border-hover: #c0c5d5;
        --fg: #1a1d2e; --fg-dim: #5a6080; --fg-muted: #8890a8;
      }
    }
  </style>
</head>

      </div>
      <div class="m-card-body">
        <div class="nav-grid" id="nav-grid"></div>
      </div>
    </div>

    <!-- Entity relationship graph -->
    <div class="m-card" id="graph">

      <div class="m-card-body">

      { id: 'hemlock-foia', section: 'investigate', title: 'Hemlock FOIA Toolkit', desc: 'Ready-to-use templates for Saginaw County agencies.', url: '/investigate/hemlock-foia/', counties: ['Saginaw'], refs: ['ellison','anderson-hemlock'] },
      { id: 'oversight-guide', section: 'investigate', title: 'Oversight Filing Guide', desc: 'How to file complaints with JTC, AGC, SCAO, MCOLES, IC3.', url: '/investigate/oversight-guide/', counties: [], refs: ['cross-subgraph-patterns','institutional-immunity'] }
    ];

    var TIMELINE = [
      { year: '2013', events: [{ date: '2013', text: 'Galen signs Cork Wine Pub agreement' }]},
      { year: '2014', events: [{ date: '2014', text: 'Schipper: prior JTC-confirmed misconduct' }]},
      { year: '2019', events: [{ date: 'Dec 2019', text: 'McCann v. Fuller filed (federal)' }]},
      { year: '2020', events: [
        { date: 'Jan 2020', text: 'Bartlett files AGC complaint against Nakfoor Pratt' },
        { date: '2020', text: 'Galen campaign: Makoski treasurer, Froias record keeper' }
      ]},
      { year: '2022', events: [{ date: '2022', text: 'Joey Nagle killed by Allegan deputy. No body camera.' }]},
      { year: '2023', events: [
        { date: 'May 5', text: 'Barry retains CMDA for Nakfoor Pratt grievances' },
        { date: 'Sep 15', text: 'Email warning about Fuller misconduct sent' },
        { date: 'Sep 19', text: 'Federal jury awards McCann $14.5M vs. Fuller' },
        { date: 'Sep 20', text: '"Aljouny" PGP key created — 4 days after Ahmad press' }
      ]},
      { year: '2024', events: [
        { date: '2024', text: 'JTC annual report: confidential admonition matching Galen' },
        { date: 'Oct 28', text: 'Jeremiah Johnson shot 5× in back. No cameras.' }
      ]},
      { year: '2025', events: [
        { date: 'Jun', text: 'Barry County approves ~$840K body cameras' },
        { date: 'Jul 21', text: 'JTC acknowledges RFIs for formal review' },
        { date: 'Nov', text: 'MSC remands Schipper case (first remand)' },
        { date: 'Nov 3', text: 'Ellison SLAPP suit filed: OLC v. Williams' }
      ]},
      { year: '2026', events: [
        { date: 'Jan', text: 'MSC remands Schipper again — 2nd in 3 months' },
        { date: 'Mar 24', text: 'UPEPA (anti-SLAPP) effective date' },
        { date: 'May 6', text: 'UPEPA special motion filed in SLAPP suit' },
        { date: 'May 12', text: 'Borrello recuses himself after denying DQ' },
        { date: 'Sep 9', text: '"Aljouny" email sent to Conrad Mallett' },
        { date: 'Oct 6', text: 'IC3 complaint filed re: Aljouny fabrication' },
        { date: 'Nov 3', text: '38th District Court election: Galen vs. Goodman' }
      ]}
    ];

    var COUNTIES = ['Saginaw','Barry','Wayne','Macomb','Allegan','St. Clair','Eastpointe','Federal'];

    // ======== SEARCH ========
    var searchIndex = null;
    if (typeof window.searchIndex !== 'undefined') {
      searchIndex = elasticlunr.Index.load(window.searchIndex);
    }

    var searchInput = document.getElementById('search-input');
    var searchResults = document.getElementById('search-results');

    searchInput.addEventListener('input', function() {
      var q = this.value.trim();
      if (q.length < 2) { searchResults.innerHTML = ''; return; }

      if (searchIndex) {
        var results = searchIndex.search(q, { fields: { title: { boost: 3 }, body: { boost: 1 } }, expand: true });
        renderSearchResults(results.slice(0, 12), q);
      } else {
        var filtered = PAGES.filter(function(p) {
          var hay = (p.title + ' ' + p.desc).toLowerCase();
          return hay.indexOf(q.toLowerCase()) >= 0;
        });
        renderLocalResults(filtered.slice(0, 12), q);
      }
    });

    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      }
    });

    function renderSearchResults(results, q) {
      if (!results.length) {
        searchResults.innerHTML = '<div style="padding:0.5rem;color:var(--fg-dim);font-size:0.8rem">No results for "' + esc(q) + '"</div>';
        return;
      }
      searchResults.innerHTML = results.map(function(r) {
        var doc = searchIndex.documentStore.getDoc(r.ref);
        var section = guessSectionFromUrl(r.ref);
        var snippet = highlightSnippet(doc.body || '', q, 120);
        return '<a class="sr-item" href="' + esc(r.ref) + '">' +
          '<div><span class="sr-title">' + esc(doc.title) + '</span>' +
          '<span class="sr-section pill pill-' + section + '">' + section + '</span></div>' +
          '<div class="sr-snippet">' + snippet + '</div></a>';
      }).join('');
    }

    function renderLocalResults(pages, q) {
      if (!pages.length) {
        searchResults.innerHTML = '<div style="padding:0.5rem;color:var(--fg-dim);font-size:0.8rem">No results for "' + esc(q) + '"</div>';
        return;
      }
      searchResults.innerHTML = pages.map(function(p) {
        return '<a class="sr-item" href="' + esc(p.url) + '">' +
          '<div><span class="sr-title">' + esc(p.title) + '</span>' +
          '<span class="sr-section pill pill-' + p.section + '">' + p.section + '</span></div>' +
          '<div class="sr-snippet">' + esc(p.desc) + '</div></a>';
      }).join('');
    }

    function guessSectionFromUrl(url) {
      if (url.indexOf('/actors/') >= 0) return 'actors';
      if (url.indexOf('/evidence/') >= 0) return 'evidence';
      if (url.indexOf('/analysis/') >= 0) return 'analysis';
      if (url.indexOf('/investigate/') >= 0) return 'investigate';
      if (url.indexOf('/timeline') >= 0) return 'timeline';
      return 'analysis';
    }

    function highlightSnippet(body, q, maxLen) {
      var lower = body.toLowerCase();
      var qLower = q.toLowerCase();
      var idx = lower.indexOf(qLower);
      var start = Math.max(0, idx - 40);
      var end = Math.min(body.length, start + maxLen);
      var snippet = body.substring(start, end);
      if (start > 0) snippet = '…' + snippet;
      if (end < body.length) snippet = snippet + '…';
      return snippet.replace(new RegExp('(' + escRegex(q) + ')', 'gi'), '<mark>$1</mark>');
    }

    // ======== NAV GRID ========
    var navGrid = document.getElementById('nav-grid');
    renderNavGrid('all');

    document.getElementById('section-filters').addEventListener('click', function(e) {
      if (!e.target.classList.contains('filter-btn')) return;
      this.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      e.target.classList.add('active');
      renderNavGrid(e.target.dataset.filter);
    });

    function renderNavGrid(filter) {
      var filtered = filter === 'all' ? PAGES : PAGES.filter(function(p) { return p.section === filter; });
      navGrid.innerHTML = filtered.map(function(p) {
        var countyPills = p.counties.map(function(c) { return '<span class="pill pill-county">' + esc(c) + '</span>'; }).join('');
        var refCount = p.refs.length;
        return '<a class="nav-item" href="' + esc(p.url) + '" data-section="' + p.section + '">' +
          '<div class="ni-title">' + esc(p.title) + '</div>' +
          '<div class="ni-desc">' + esc(p.desc) + '</div>' +
          '<div class="ni-meta">' +
            '<span class="pill pill-' + p.section + '">' + p.section + '</span>' +
            countyPills +
            (refCount > 0 ? '<span class="pill pill-count">' + refCount + ' refs</span>' : '') +
          '</div></a>';
      }).join('');
    }

    // ======== ENTITY GRAPH ========
    renderGraph();

    function renderGraph() {
      var container = document.getElementById('graph-container');
      var W = container.clientWidth || 600;
      var H = Math.max(360, W * 0.5);

      var nodes = PAGES.map(function(p, i) {
        var angle = (i / PAGES.length) * 2 * Math.PI;
        var section = p.section;
        var r = section === 'actors' ? 0.25 : section === 'evidence' ? 0.45 : section === 'analysis' ? 0.65 : 0.82;
        r *= Math.min(W, H) * 0.42;
        return {
          id: p.id, section: p.section, title: p.title.length > 22 ? p.title.substring(0,20) + '…' : p.title,
          x: W/2 + r * Math.cos(angle - Math.PI/2),
          y: H/2 + r * Math.sin(angle - Math.PI/2),
          url: p.url, refs: p.refs
        };
      });
      var nodeMap = {};
      nodes.forEach(function(n) { nodeMap[n.id] = n; });

      var edges = [];
      PAGES.forEach(function(p) {
        p.refs.forEach(function(ref) {
          if (nodeMap[ref] && p.id < ref) {
            edges.push({ from: p.id, to: ref });
          }
        });
      });

      var colors = { actors: 'var(--red)', evidence: 'var(--green)', analysis: 'var(--purple)', investigate: 'var(--cyan)' };

      var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
      edges.forEach(function(e) {
        var a = nodeMap[e.from], b = nodeMap[e.to];
        if (a && b) svg += '<line class="graph-edge" x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '"/>';
      });
      nodes.forEach(function(n) {
        var c = colors[n.section] || 'var(--fg-dim)';
        svg += '<a href="' + n.url + '" class="graph-node">' +
          '<circle cx="' + n.x + '" cy="' + n.y + '" r="7" fill="' + c + '" stroke="' + c + '" stroke-width="1.5" opacity="0.85"/>' +
          '<text x="' + (n.x + 10) + '" y="' + (n.y + 3) + '" fill="var(--fg-dim)" font-size="9">' + esc(n.title) + '</text></a>';
      });
      svg += '</svg>';
      container.innerHTML = svg;
      container.style.height = H + 'px';
    }

    // ======== CROSS-REF MATRIX ========
    renderXref();

    function renderXref() {
      var table = document.getElementById('xref-table');
      var html = '<thead><tr><th>Page</th><th>Section</th><th>Cross-References</th></tr></thead><tbody>';
      PAGES.filter(function(p) { return p.refs.length > 0; }).sort(function(a,b) { return b.refs.length - a.refs.length; }).forEach(function(p) {
        var refTags = p.refs.map(function(ref) {
          var rp = PAGES.find(function(x) { return x.id === ref; });
          if (!rp) return '';
          var c = { actors: 'var(--red)', evidence: 'var(--green)', analysis: 'var(--purple)', investigate: 'var(--cyan)' }[rp.section] || 'var(--fg-dim)';
          return '<a class="xref-tag" href="' + esc(rp.url) + '" style="background:' + c.replace(')', ',0.12)').replace('var(', 'rgba(') + ';background:color-mix(in srgb, ' + c + ' 12%, transparent);color:' + c + '">' + esc(rp.title.length > 28 ? rp.title.substring(0,26)+'…' : rp.title) + '</a>';
        }).join('');
        html += '<tr><td class="xref-from"><a href="' + esc(p.url) + '">' + esc(p.title.length > 32 ? p.title.substring(0,30)+'…' : p.title) + '</a></td>' +
          '<td><span class="pill pill-' + p.section + '">' + p.section + '</span></td>' +
          '<td>' + refTags + '</td></tr>';
      });
      html += '</tbody>';
      table.innerHTML = html;
    }

    // ======== TIMELINE ========
    renderTimeline();

    function renderTimeline() {
      var strip = document.getElementById('timeline-strip');
      strip.innerHTML = TIMELINE.map(function(y) {
        var eventsHtml = y.events.map(function(e) {
          return '<div class="tl-event"><span class="tl-date">' + esc(e.date) + '</span> ' + esc(e.text) + '</div>';
        }).join('');
        return '<div class="tl-year"><div class="tl-year-label">' + esc(y.year) + '</div>' + eventsHtml + '</div>';
      }).join('');
    }

    // ======== NAV ANCHOR SCROLLING ========
    document.querySelectorAll('.membrane-header .nav-links a').forEach(function(a) {
      a.addEventListener('click', function(e) {
        var href = this.getAttribute('href');
        if (href && href.startsWith('#')) {
          e.preventDefault();
          var el = document.getElementById(href.substring(1));
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            document.querySelectorAll('.membrane-header .nav-links a').forEach(function(x) { x.classList.remove('active'); });
            this.classList.add('active');
          }
        }
      });
    });

    // ======== UTILITIES ========
    function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function escRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    // Responsive graph
    window.addEventListener('resize', debounce(renderGraph, 250));
    function debounce(fn, ms) { var t; return function() { clearTimeout(t); t = setTimeout(fn, ms); }; }

  })();
  </script>
</body>
</html>
